<div class="dashboard">
  <div class="sidebar_main_swipe sidebar_main_active">
    <aside id="sidebar_main">

      <div class="menu_section uk-margin-medium-top">

        @if (deployableServiceBundle?.active === false) {
          <div class="rejected">
            <div class="uk-label uk-align-right uk-margin-right" uk-tooltip="Some actions are disabled for inactive resources.">Inactive</div>
          </div>
        }

        <div class="sidebar_heading">MONITOR</div>

        <ul>

          <li [routerLinkActive]="['current_section']" #hist="routerLinkActive">
            <a [routerLink]="['/dashboard', providerId, 'deployable-service-dashboard', deployableServiceId, 'history']">
              <img src="{{hist.isActive ? 'assets/images/new-icons/history-active.svg' : 'assets/images/new-icons/history.svg'}}" class="uk-margin-small-right">
              Update History
            </a>
          </li>

        </ul>
      </div>

      <div class="menu_section border_top">
        <div class="sidebar_heading">ACTIONS</div>

        <ul>

          @if (catalogueId == null) {
            <li>
              <a [routerLink]="['/provider/' + pidHandler.customEncodeURIComponent(providerId) + '/deployable-service/update/' + pidHandler.customEncodeURIComponent(deployableServiceId)]">
                <img src="../../../../../assets/images/new-icons/add-service.svg" class="uk-margin-small-right">
                Update Deployable Application
              </a>
            </li>
          }

          <li>
            <a [routerLink]="['/dashboard', pidHandler.customEncodeURIComponent(providerId)]">
              <img src="../../../../../assets/images/new-icons/stats.svg" class="uk-margin-small-right">
              Back to Provider Dashboard
            </a>
          </li>

        </ul>
      </div>

    </aside><!-- main sidebar end -->

    <div id="page_content">
      <app-dashboard-breadcrumbs></app-dashboard-breadcrumbs>
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
